[project.optional-dependencies]
# For development / testing (extend as needed)
 dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[project.scripts]
codesage-mcp = "codesage_mcp.server:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

# NEW: restrict packages to intended ones
[tool.setuptools.packages.find]
include = ["core", "cli", "codesage_mcp"]
exclude = ["tests*", "outputs*", "mcp*"]

# If you prefer an explicit fixed list instead, comment the block above and use:
# [tool.setuptools]
# packages = ["core", "cli", "codesage_mcp"]

[tool.uv]
# Enable uv lock behaviour; generate lock with: uv lock
managed = true

[tool.ruff]
line-length = 100


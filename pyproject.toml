[project]
name = "codesage-core"
version = "0.1.0"
description = "CodeSage Core MCP server built on FastMCP"
readme = "README.md"
authors = [ { name = "CodeSage" } ]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=0.1.0",  # Adjust to actual latest version
    "pydantic>=2.7",
    "typing-extensions>=4.8.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.1.0",
    "repomix",
    "sentence-transformers",
    "qdrant-client",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5.0",
    "mypy>=1.10",
]

[project.scripts]
codesage-core = "codesage_core.server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
# uv specific settings (placeholder: uv reads pyproject dependencies directly)
managed = true

[tool.pytest.ini_options]
addopts = "-ra -q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
